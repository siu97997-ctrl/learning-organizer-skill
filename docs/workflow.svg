<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Learning Organizer workflow</title>
  <desc id="desc">Learning conversations are extracted, deduplicated, classified and incrementally written to a Notion handbook.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Learning Organizer</text>
  <text x="600" y="88" text-anchor="middle" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="15">From chronological chats to a reusable knowledge map</text>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="54" y="132" width="190" height="130" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="149" y="180" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Conversations</text>
    <text x="149" y="210" text-anchor="middle" fill="#cbd5e1" font-size="14">Questions + answers</text>
    <text x="149" y="235" text-anchor="middle" fill="#94a3b8" font-size="13">Across tasks and dates</text>

    <rect x="294" y="132" width="190" height="130" rx="18" fill="#172554" stroke="#3b82f6"/>
    <text x="389" y="180" text-anchor="middle" fill="#eff6ff" font-size="18" font-weight="700">Extract</text>
    <text x="389" y="210" text-anchor="middle" fill="#bfdbfe" font-size="14">Keep complete context</text>
    <text x="389" y="235" text-anchor="middle" fill="#93c5fd" font-size="13">Remove chat noise</text>

    <rect x="534" y="132" width="190" height="130" rx="18" fill="#312e81" stroke="#818cf8"/>
    <text x="629" y="180" text-anchor="middle" fill="#eef2ff" font-size="18" font-weight="700">Organize</text>
    <text x="629" y="210" text-anchor="middle" fill="#c7d2fe" font-size="14">Semantic deduplication</text>
    <text x="629" y="235" text-anchor="middle" fill="#a5b4fc" font-size="13">Knowledge-map categories</text>

    <rect x="774" y="132" width="190" height="130" rx="18" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="869" y="180" text-anchor="middle" fill="#f0fdfa" font-size="18" font-weight="700">Update</text>
    <text x="869" y="210" text-anchor="middle" fill="#99f6e4" font-size="14">Targeted Notion edits</text>
    <text x="869" y="235" text-anchor="middle" fill="#5eead4" font-size="13">Strict write boundary</text>

    <rect x="1014" y="132" width="132" height="130" rx="18" fill="#3f1d2e" stroke="#f472b6"/>
    <text x="1080" y="180" text-anchor="middle" fill="#fdf2f8" font-size="18" font-weight="700">Review</text>
    <text x="1080" y="210" text-anchor="middle" fill="#fbcfe8" font-size="14">Daily index</text>
    <text x="1080" y="235" text-anchor="middle" fill="#f9a8d4" font-size="13">Next steps</text>
  </g>

  <g stroke="#93c5fd" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M250 197 H284"/>
    <path d="M490 197 H524"/>
    <path d="M730 197 H764"/>
    <path d="M970 197 H1004"/>
  </g>
  <text x="600" y="320" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13">One canonical answer · Stable taxonomy · Safe incremental writes</text>
</svg>
